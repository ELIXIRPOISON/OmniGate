# Bootstrap route registry, read once at boot. Empty on purpose: this is the file the production
# image ships, and a gateway in front of your services should start with none of ours.
#
# Add routes in the dashboard (Routes -> Add route) or with POST /admin/v1/routes; those live in the
# database, take effect immediately and override a same-named entry here. Use this file instead when
# routes belong in version control: see docs/15-ADOPTING.md for the fields and precedence, and mount
# your copy over /app/apps/gateway/routes.yaml or point ROUTES_FILE at it.
#
# The demo stack uses routes.demo.yaml.
routes: []

name: Release

# Publishes the runtime and migrate images to GHCR when a version tag is pushed, so an adopter can
# `docker compose -f compose.prod.yml up` without building anything.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/omnigate:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/omnigate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/omnigate-migrate:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/omnigate-migrate:latest
          cache-from: type=gha

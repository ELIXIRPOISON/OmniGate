name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve @omnigate/shared through its built dist and the gateway needs its
      # generated Prisma client, so produce both before typecheck/tests.
      - run: pnpm gen
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Gateway unit coverage
        run: pnpm --filter @omnigate/gateway test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-coverage
          path: apps/gateway/coverage/lcov.info
          if-no-files-found: ignore
      - run: pnpm --filter @omnigate/gateway test:e2e
      - name: "Integration (Testcontainers: Redis 7 + Postgres 16)"
        run: pnpm --filter @omnigate/gateway test:integration
      - run: pnpm -r build

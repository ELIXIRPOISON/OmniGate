name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI attribution anywhere in the commit history
        run: |
          if git log --format='%H %B' | grep -iE 'Co-Authored-By:.*(claude|anthropic)|Claude-Session:'; then
            echo "::error::a commit message carries an AI attribution trailer; rewrite it before merging"
            exit 1
          fi
          echo "commit history clean"

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Workspace packages resolve @omnigate/shared through its built dist and the gateway needs its
      # generated Prisma client, so produce both before typecheck/tests.
      - run: pnpm gen
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Gateway unit coverage
        run: pnpm --filter @omnigate/gateway test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-coverage
          path: apps/gateway/coverage/lcov.info
          if-no-files-found: ignore
      - run: pnpm --filter @omnigate/gateway test:e2e
      - name: "Integration (Testcontainers: Redis 7 + Postgres 16)"
        id: integration
        run: |
          set -o pipefail
          pnpm --filter @omnigate/gateway test:integration 2>&1 | tee integration.log

      - name: Publish the integration failure to the job summary
        if: failure() && steps.integration.outcome == 'failure'
        run: |
          {
            echo '### Integration suite failed'
            echo '```'
            tail -n 120 integration.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm -r build

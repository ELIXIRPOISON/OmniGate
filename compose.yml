# DEVELOPMENT ONLY. The credentials below are throwaway placeholders that are deliberately
# committed so `docker compose up` works on a fresh clone. Never deploy this file: the production
# stack (Sprint 9) requires real secrets supplied by the platform, never defaults.
#
# Local development stack (docs/08 S1-08, docs/10 §2): gateway with hot reload, mock upstream,
# Redis and Postgres. `docker compose up`, then seed once with
# `docker compose exec gateway pnpm --filter @omnigate/gateway seed` and follow the printed curl.
#
# Values from ./.env (copy of .env.example) flow in via env_file; the entries under `environment`
# override the ones that must point at container hostnames.
# After changing dependencies: `docker compose build && docker compose up -V` (renews node_modules volumes).
# If 6379/5432 are busy on your machine, set REDIS_HOST_PORT / POSTGRES_HOST_PORT in .env.
name: omnigate

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /repo
  volumes:
    - .:/repo
    - /repo/node_modules
    - /repo/apps/gateway/node_modules
    - /repo/apps/dashboard/node_modules
    - /repo/apps/mock-upstream/node_modules
    - /repo/packages/shared/node_modules

services:
  gateway:
    <<: *node
    command: >
      sh -c "pnpm --filter @omnigate/shared build
      && pnpm --filter @omnigate/gateway prisma:generate
      && pnpm --filter @omnigate/gateway prisma:migrate:deploy
      && pnpm --filter @omnigate/gateway start:dev"
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://omnigate:omnigate@postgres:5432/omnigate
      REDIS_URL: redis://redis:6379
      MOCK_UPSTREAM_URL: http://mock-upstream:3001
      ROUTES_FILE: ./routes.yaml
      ALLOW_PRIVATE_UPSTREAMS: "true"
      EXPOSE_ANOMALY_SCORE: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-32-plus-random-bytes}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-only-change-me-rotating-invalidates-all-keys}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-only-must-differ-from-JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # host.docker.internal reaches a model server running on the host (e.g. Ollama).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ANOMALY_AUTO_THROTTLE: ${ANOMALY_AUTO_THROTTLE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mock-upstream:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  mock-upstream:
    <<: *node
    command: pnpm --filter @omnigate/mock-upstream start:dev
    ports:
      - "3001:3001"
    environment:
      PORT: 3001

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Host port is configurable so the stack coexists with a Redis you already run locally.
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnigate
      POSTGRES_PASSWORD: omnigate
      POSTGRES_DB: omnigate
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnigate -d omnigate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
